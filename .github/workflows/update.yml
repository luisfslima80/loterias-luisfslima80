name: Atualizar resultados das quatro loterias
on:
  workflow_dispatch:
  schedule:
    # 06:20 e 12:20 no horario de Brasilia (UTC-3)
    - cron: '20 9,15 * * *'
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Buscar concursos da Caixa
        run: python update_results.py
      - name: Publicar dados atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lotofacil.json data/megasena.json data/quina.json data/timemania.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza resultados das loterias"
            git push
          fi
